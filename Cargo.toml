[package]
name = "prmoji"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.23"
consistenttime = "0.2.0"
dotenv = "0.15.0"
futures = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["full"] }
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["uuid", "chrono", "postgres", "tls-rustls", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
